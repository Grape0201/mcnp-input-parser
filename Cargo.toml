[package]
name = "mcnp-input-parser"
version = "0.1.0"
edition = "2021"
description = "MCNP input file parser built with nom"
default-run = "mcnp-input-parser"

[[bin]]
name = "mcnp-input-parser"
path = "src/main.rs"

[[bin]]
name = "mcnp-lsp"
path = "src/bin/mcnp-lsp.rs"

[dependencies]
nom = "7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
tower-lsp = "0.20"
